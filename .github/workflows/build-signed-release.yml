
name: Build Signed Attendance APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-24.04

    permissions:
      contents: read

    steps:
      - name: Download source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Android 16 SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          echo "Android 16 SDK found"

      - name: Extract Android project
        shell: bash
        run: |
          set -euo pipefail

          unzip -tq attendance-source.zip
          mkdir -p project
          unzip -q attendance-source.zip -d project

          SETTINGS=$(find project -type f \
            \( -name settings.gradle -o -name settings.gradle.kts \) \
            -print -quit)

          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle not found in ZIP"
            exit 1
          fi

          APP_ROOT=$(dirname "$SETTINGS")
          echo "APP_ROOT=$APP_ROOT" >> "$GITHUB_ENV"
          echo "Project folder: $APP_ROOT"

      - name: Build Release APK
        shell: bash
        run: |
          gradle --no-daemon --stacktrace \
            -p "$APP_ROOT" :app:assembleRelease

      - name: Sign Release APK
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          : "${SIGNING_KEYSTORE_B64:?Missing keystore}"
          : "${RELEASE_KEYSTORE_PASSWORD:?Missing password}"
          : "${RELEASE_KEY_ALIAS:?Missing alias}"
          : "${RELEASE_KEY_PASSWORD:?Missing key password}"

          KEYSTORE="$RUNNER_TEMP/attendance-release.jks"

          printf '%s' "$SIGNING_KEYSTORE_B64" \
            | base64 --decode > "$KEYSTORE"

          APK_DIR="$APP_ROOT/app/build/outputs/apk/release"

          APK="$APK_DIR/app-release-unsigned.apk"

          if [ ! -f "$APK" ]; then
            APK=$(find "$APK_DIR" -maxdepth 1 \
              -type f -name '*.apk' -print -quit)
          fi

          if [ -z "$APK" ] || [ ! -f "$APK" ]; then
            echo "::error::Release APK not found"
            exit 1
          fi

          TOOLS=$(find "$ANDROID_HOME/build-tools" \
            -mindepth 1 -maxdepth 1 -type d \
            | sort -V | tail -n 1)

          mkdir -p output

          "$TOOLS/zipalign" -f -p 4 \
            "$APK" "$RUNNER_TEMP/aligned.apk"

          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias "$RELEASE_KEY_ALIAS" \
            --ks-pass env:RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:RELEASE_KEY_PASSWORD \
            --out output/attendance-v1.1-release.apk \
            "$RUNNER_TEMP/aligned.apk"

          "$TOOLS/apksigner" verify --verbose \
            output/attendance-v1.1-release.apk

          echo "APK signed successfully"

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-v1.1-signed-apk
          path: output/attendance-v1.1-release.apk
          if-no-files-found: error
