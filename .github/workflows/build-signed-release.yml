name: Build Signed Attendance APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-signed-apk:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout files
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # No deprecated 'tools' SDK package or setup-android cmdline-tool downloads.
      - name: Check Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -f "$SDK/platforms/android-36/android.jar" || {
            echo '::error::Android SDK 36 missing from this GitHub runner'
            exit 1
          }
          echo 'Android 16 SDK detected'

      - name: Extract attendance-source.zip
        shell: bash
        run: |
          set -euo pipefail
          test -s attendance-source.zip || {
            echo '::error::Upload attendance-source.zip to the repository top level'
            exit 1
          }
          unzip -tq attendance-source.zip
          # Extract to a unique temporary directory to avoid collisions with
          # previously extracted files committed to the repository.
          EXTRACT_DIR="$(mktemp -d "$RUNNER_TEMP/attendance-project.XXXXXX")"
          unzip -oq attendance-source.zip -d "$EXTRACT_DIR"
          SETTINGS=$(find "$EXTRACT_DIR" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          test -n "$SETTINGS" || {
            echo '::error::Gradle settings.gradle(.kts) missing from ZIP'
            exit 1
          }
          APP_ROOT="$(dirname "$SETTINGS")"
          test -f "$APP_ROOT/app/build.gradle.kts"
          grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*36' "$APP_ROOT/app/build.gradle.kts"
          printf 'APP_ROOT=%s\n' "$APP_ROOT" >> "$GITHUB_ENV"
          echo "Using Android project: $APP_ROOT"

      - name: Restore signing key privately
        shell: bash
        env:
          SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for key in SIGNING_KEYSTORE_B64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            test -n "${!key}" || { echo "::error::GitHub Secret missing: $key"; exit 1; }
          done
          printf '%s' "$SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/attendance-release.jks"
          chmod 600 "$RUNNER_TEMP/attendance-release.jks"
          test -s "$RUNNER_TEMP/attendance-release.jks"

      - name: Build owner-signed Release APK
        shell: bash
        env:
          RELEASE_KEYSTORE_FILE: ${{ runner.temp }}/attendance-release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace -p "$APP_ROOT" :app:assembleRelease

      - name: Verify APK signature
        shell: bash
        run: |
          set -euo pipefail
          APK="$APP_ROOT/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -tq "$APK"
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SIGNER=$(find "$SDK/build-tools" -maxdepth 2 -type f -name apksigner | sort -V | tail -n 1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          "$SIGNER" verify --print-certs "$APK" | grep 'SHA-256 digest'
          sha256sum "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-v1.3-signed-apk
          path: ${{ env.APP_ROOT }}/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error

      - name: Remove temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/attendance-release.jks"
