name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Ubuntu 24.04 runner already contains Android SDK Platform 36.
      # No setup-android download or cmdline-tools-version mismatch.
      - name: Check Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -f "$SDK/platforms/android-36/android.jar" || {
            echo 'Android 16 SDK 36 not installed on runner'
            exit 1
          }
          echo 'Android SDK 36 is ready'

      - name: Locate and verify V1.8 Android project
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/attendance-source.zip"
          if [[ ! -s "$ARCHIVE" ]]; then
            echo '::error::attendance-source.zip 파일이 저장소 루트에 없거나 비어 있습니다.'
            exit 1
          fi
          echo "Source archive: $(sha256sum "$ARCHIVE" | cut -d' ' -f1)"
          unzip -tq "$ARCHIVE" || {
            echo '::error::attendance-source.zip 내부 ZIP 데이터가 손상되었습니다.'
            exit 1
          }
          echo 'ZIP integrity passed; locating Android project...'
          WORK="$(mktemp -d "${RUNNER_TEMP:-/tmp}/attendance-v18.XXXXXX")"
          unzip -q "$ARCHIVE" -d "$WORK/outer"

          locate_project() {
            local base="$1" config root
            while IFS= read -r -d '' config; do
              root="$(dirname "$config")"
              if [[ -f "$root/app/build.gradle.kts" ]]; then
                printf '%s\n' "$root"
                return 0
              fi
            done < <(find "$base" -type f \( -name settings.gradle.kts -o -name settings.gradle \) -print0)
            return 1
          }

          PROJECT_ROOT="$(locate_project "$WORK/outer")" || PROJECT_ROOT=''
          if [[ -z "$PROJECT_ROOT" ]]; then
            # Also handle an accidentally renamed whole GitHub upload bundle.
            INNER="$(find "$WORK/outer" -type f -name attendance-source.zip -print -quit)"
            if [[ -n "$INNER" ]]; then
              echo 'Upload bundle detected. Extracting nested attendance-source.zip...'
              unzip -tq "$INNER" || {
                echo '::error::중첩된 attendance-source.zip이 손상되었습니다.'
                exit 1
              }
              unzip -q "$INNER" -d "$WORK/inner"
              PROJECT_ROOT="$(locate_project "$WORK/inner")" || PROJECT_ROOT=''
            fi
          fi
          if [[ -z "$PROJECT_ROOT" ]]; then
            echo '::error::ZIP 안에서 settings.gradle(.kts) 및 app/build.gradle.kts를 찾지 못했습니다.'
            echo '상위 폴더가 들어간 ZIP은 지원하지만, 앱 소스가 들어 있지 않은 ZIP은 빌드할 수 없습니다.'
            echo 'ZIP entries (first 40):'
            unzip -Z1 "$ARCHIVE" | sed -n '1,40p'
            exit 1
          fi
          echo "Project found: ${PROJECT_ROOT#"$WORK"/}"
          rm -rf project
          mkdir -p project
          cp -a "$PROJECT_ROOT/." project/

          GRADLE_FILE='project/app/build.gradle.kts'
          # The most common upload mistake is replacing the workflows but leaving
          # the old 1.5.0 archive in the GitHub repository root.
          actual_code="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' "$GRADLE_FILE" | head -n 1)"
          actual_name="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' "$GRADLE_FILE" | head -n 1)"
          echo "Found app version: ${actual_name:-unknown} (code ${actual_code:-unknown})"
          if [[ "$actual_code" != '180' || "$actual_name" != '1.8.0' ]]; then
            echo "::error file=attendance-source.zip::업로드된 앱 소스는 ${actual_name:-미확인} / ${actual_code:-미확인}입니다. V1.8.0 / 180 소스 ZIP을 저장소 최상단의 attendance-source.zip으로 교체하고 Commit하세요."
            echo "Archive SHA-256: $(sha256sum "$ARCHIVE" | awk '{print $1}')"
            echo 'Source build settings:'
            grep -nE 'compileSdk|targetSdk|versionCode|versionName' "$GRADLE_FILE" || true
            if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
              {
                echo '### ❌ V1.8 소스 ZIP 교체 필요'
                echo "현재 ZIP: ${actual_name:-미확인} / ${actual_code:-미확인}"
                echo '필요 버전: 1.8.0 / 180'
                echo 'GitHub 저장소 루트의 **attendance-source.zip**을 새 파일로 교체하고 Commit한 후 재실행하세요.'
                echo '**워크플로 2개만 바꾸면 해결되지 않습니다.**'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi
          for item in 'compileSdk:36' 'targetSdk:36'; do
            key="${item%%:*}"; value="${item#*:}"
            if ! grep -Eq "^[[:space:]]*$key[[:space:]]*=[[:space:]]*$value([[:space:]]|$)" "$GRADLE_FILE"; then
              echo "::error file=attendance-source.zip::잘못된 SDK 설정: $key = $value 이 필요합니다."
              grep -nE 'compileSdk|targetSdk' "$GRADLE_FILE" || true
              exit 1
            fi
          done
          echo 'V1.8.0 / 180 verified — source archive and workflow agree.'
          if [[ ! -f project/app/src/main/AndroidManifest.xml ]]; then
            echo '::error::AndroidManifest.xml 파일이 없습니다.'
            exit 1
          fi
          echo "APP_ROOT=project" >> "$GITHUB_ENV"
          echo 'V1.8 Android project ready. Starting Gradle build...'
      - name: Preflight V1.8 sources and resources
        shell: bash
        run: |
          set -euo pipefail
          python3 project/tests/V16BuildPreflight.py
          python3 project/tests/V17InlineEditorScrollBarRegressionTest.py

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          echo 'APK archive verified'

      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-v1.8-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
