
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Check Android 16 SDK
        run: |
          test -f "$ANDROID_HOME/platforms/android-36/android.jar"
          echo "Android 16 SDK ready!"

      - name: Extract source
        run: |
          unzip -tq attendance-source.zip
          mkdir -p project
          unzip -q attendance-source.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
