
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: |
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Extract source
        run: |
          unzip -tq attendance-source.zip
          mkdir -p project
          unzip -q attendance-source.zip -d project

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
