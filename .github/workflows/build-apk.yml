name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Get files
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      # Ubuntu 24.04 runner already contains Android SDK Platform 36.
      # No setup-android download or cmdline-tools-version mismatch.
      - name: Check Android 16 SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -f "$SDK/platforms/android-36/android.jar" || {
            echo 'Android 16 SDK 36 not installed on runner'
            exit 1
          }
          echo 'Android SDK 36 is ready'

      - name: Extract v1.5 source
        shell: bash
        run: |
          set -euo pipefail
          test -s attendance-source.zip
          unzip -tq attendance-source.zip
          rm -rf project
          mkdir project
          unzip -q attendance-source.zip -d project
          test -f project/app/build.gradle.kts
          grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*36' project/app/build.gradle.kts
          grep -Eq 'targetSdk[[:space:]]*=[[:space:]]*36' project/app/build.gradle.kts
          grep -Eq 'versionCode[[:space:]]*=[[:space:]]*150' project/app/build.gradle.kts
          grep -Eq 'versionName[[:space:]]*=[[:space:]]*"1.5.0"' project/app/build.gradle.kts
          echo 'v1.5, Android SDK 36 checked'

      - name: Build APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK=project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          unzip -tq "$APK"
          echo 'APK archive verified'

      - name: Downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: attendance-v1.5-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
