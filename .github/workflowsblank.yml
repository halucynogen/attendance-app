name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android 16 SDK (API 36)
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Extract source (always replace old files)
        shell: bash
        run: |
          set -euo pipefail
          test -s attendance-source.zip
          unzip -tq attendance-source.zip
          rm -rf project
          mkdir -p project
          unzip -q attendance-source.zip -d project
          test -f project/app/build.gradle.kts
          echo '=== Android version in the ACTUAL extracted source ==='
          grep -E 'compileSdk|targetSdk|minSdk|versionCode|versionName' project/app/build.gradle.kts
          grep -Eq 'compileSdk[[:space:]]*=[[:space:]]*36' project/app/build.gradle.kts
          grep -Eq 'targetSdk[[:space:]]*=[[:space:]]*36' project/app/build.gradle.kts
          sha256sum attendance-source.zip
      - name: Build APK
        working-directory: project
        run: gradle --no-daemon --stacktrace :app:assembleDebug
      - name: Verify APK archive
        shell: bash
        run: |
          set -euo pipefail
          test -s project/app/build/outputs/apk/debug/app-debug.apk
          unzip -tq project/app/build/outputs/apk/debug/app-debug.apk
          sha256sum project/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: attendance-app-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
